# OIDC client secret for Elasticsearch to exchange authorization codes with Keycloak
# This is loaded into the Elasticsearch keystore via ECK secureSettings
apiVersion: v1
kind: Secret
metadata:
  name: kibana-oidc-client-secret
  namespace: elastic
type: Opaque
stringData:
  # IMPORTANT: Replace with the same secret set in the Keycloak realm for the "kibana" client
  xpack.security.authc.realms.oidc.keycloak.rp.client_secret: REPLACE_WITH_STRONG_SECRET
