apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import
  namespace: keycloak
spec:
  template:
    spec:
      containers:
        - name: realm-importer
          command:
            - /bin/sh
            - -c
            - |
              KC_URL="https://keycloak-service.keycloak.svc:8443"

              # Wait for Keycloak to be ready
              echo "Waiting for Keycloak..."
              until curl -sk "${KC_URL}/realms/master" | grep -q '"realm"'; do
                sleep 5
              done
              echo "Keycloak is ready"

              # Get admin token
              echo "Obtaining admin token..."
              TOKEN=$(curl -sk "${KC_URL}/realms/master/protocol/openid-connect/token" \
                -d "client_id=admin-cli" \
                -d "username=${KC_ADMIN_USER}" \
                -d "password=${KC_ADMIN_PASS}" \
                -d "grant_type=password" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to obtain admin token"
                exit 1
              fi
              echo "Token obtained"

              # Check if realm already exists
              HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "${KC_URL}/admin/realms/eck-2026")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Realm eck-2026 already exists, skipping import"
                exit 0
              fi

              # Create the realm
              echo "Creating eck-2026 realm..."
              HTTP_CODE=$(curl -sk -o /tmp/response.txt -w "%{http_code}" \
                -X POST "${KC_URL}/admin/realms" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d '{
                  "id": "eck-2026",
                  "realm": "eck-2026",
                  "displayName": "ECK 2026",
                  "enabled": true,
                  "roles": {
                    "realm": [
                      {"name": "user"},
                      {"name": "admin"}
                    ]
                  },
                  "clients": [
                    {
                      "clientId": "argocd",
                      "enabled": true,
                      "publicClient": false,
                      "standardFlowEnabled": true,
                      "directAccessGrantsEnabled": false,
                      "rootUrl": "https://argocd.hermanwong.io",
                      "redirectUris": ["https://argocd.hermanwong.io/auth/callback"],
                      "webOrigins": ["https://argocd.hermanwong.io"],
                      "protocol": "openid-connect",
                      "secret": "REPLACE_WITH_STRONG_SECRET"
                    },
                    {
                      "clientId": "kibana",
                      "enabled": true,
                      "publicClient": false,
                      "standardFlowEnabled": true,
                      "directAccessGrantsEnabled": false,
                      "rootUrl": "https://kibana.hermanwong.io",
                      "redirectUris": [
                        "https://kibana.hermanwong.io/api/security/oidc/callback",
                        "https://kibana.hermanwong.io/*"
                      ],
                      "webOrigins": ["https://kibana.hermanwong.io"],
                      "protocol": "openid-connect",
                      "secret": "REPLACE_WITH_STRONG_SECRET",
                      "protocolMappers": [
                        {
                          "name": "realm-roles",
                          "protocol": "openid-connect",
                          "protocolMapper": "oidc-usermodel-realm-role-mapper",
                          "config": {
                            "claim.name": "roles",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true",
                            "multivalued": "true",
                            "jsonType.label": "String"
                          }
                        }
                      ]
                    },
                    {
                      "clientId": "kiali",
                      "enabled": true,
                      "publicClient": false,
                      "standardFlowEnabled": true,
                      "directAccessGrantsEnabled": false,
                      "rootUrl": "https://kiali.hermanwong.io",
                      "redirectUris": ["https://kiali.hermanwong.io/*"],
                      "webOrigins": ["https://kiali.hermanwong.io"],
                      "protocol": "openid-connect",
                      "secret": "REPLACE_WITH_STRONG_SECRET"
                    }
                  ],
                  "users": [
                    {
                      "username": "admin",
                      "enabled": true,
                      "email": "admin@example.com",
                      "firstName": "Admin",
                      "lastName": "User",
                      "credentials": [{"type": "password", "value": "admin", "temporary": false}],
                      "realmRoles": ["admin", "user"]
                    },
                    {
                      "username": "viewer",
                      "enabled": true,
                      "email": "viewer@example.com",
                      "firstName": "Viewer",
                      "lastName": "User",
                      "credentials": [{"type": "password", "value": "viewer", "temporary": false}],
                      "realmRoles": ["user"]
                    }
                  ]
                }')

              if [ "$HTTP_CODE" = "201" ]; then
                echo "Realm eck-2026 created successfully"
              else
                echo "ERROR: Failed to create realm (HTTP $HTTP_CODE)"
                cat /tmp/response.txt
                exit 1
              fi
