# TLS certificate for Kiali
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kiali-tls
  namespace: istio-system
spec:
  secretName: kiali-tls-secret
  issuerRef:
    name: eck-2026-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - kiali.istio-system.svc
    - kiali.istio-system.svc.cluster.local
    - localhost
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
