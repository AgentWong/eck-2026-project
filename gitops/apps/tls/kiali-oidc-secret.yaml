# OIDC client secret for Kiali to authenticate users via Keycloak
# Kiali reads this from a Secret named "kiali" with key "oidc-secret"
apiVersion: v1
kind: Secret
metadata:
  name: kiali
  namespace: istio-system
type: Opaque
stringData:
  # IMPORTANT: Replace with the same secret set in the Keycloak realm for the "kiali" client
  oidc-secret: REPLACE_WITH_STRONG_SECRET
