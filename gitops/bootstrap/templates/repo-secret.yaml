{{- if .Values.repo.password }}
apiVersion: v1
kind: Secret
metadata:
  name: repo-eck-2026
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: {{ .Values.repoURL }}
  username: {{ .Values.repo.username | default "git" }}
  password: {{ .Values.repo.password }}
{{- end }}
