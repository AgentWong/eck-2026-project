{{- if .Values.istio.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 28.9.1
    helm:
      valuesObject:
        # Disable all sub-charts — we only need the Prometheus server for Kiali/Istio metrics
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          retention: 1h
          global:
            scrape_interval: 15s
          persistentVolume:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.istio.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
